<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
         <div class="login">
      <h1>Login</h1>
      </div>
      <div class="box">
        <label>Email: </label>
        <input
          id="email"
          type="text"
          placeholder="Enter your Email"
        /><br /><br />
        <label>Password: </label>
        <input
          id="password"
          type="password"
          placeholder="password"
        /><br /><br />
        <label>
          <input type="checkbox" />
          Remember me
        </label>
        <br><br>
        <button id="button" type="submit">Login</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
